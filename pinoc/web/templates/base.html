<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07131d"><title>{% block title %}PiNOC{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body data-csrf="{{ csrf_token() }}"><a class="skip-link" href="#content">Skip to content</a>
<header class="site-header"><div class="header-inner"><a href="/" class="brand" aria-label="PiNOC fleet overview"><span class="brand-mark">P</span><span>PiNOC <b>Web</b><small>Network operations</small></span></a>
<nav aria-label="Primary navigation">
<a href="/" {% if request.path == '/' %}aria-current="page"{% endif %}>Fleet</a><a href="/alerts" {% if request.path == '/alerts' %}aria-current="page"{% endif %}>Alerts</a><a href="/events" {% if request.path == '/events' %}aria-current="page"{% endif %}>Events</a><a href="/integrations" {% if request.path in ['/integrations','/adsb','/displays','/software','/network-inventory'] %}aria-current="page"{% endif %}>Integrations</a><a href="/agents" {% if request.path in ['/agents','/workspaces'] or request.path.startswith('/jobs') %}aria-current="page"{% endif %}>Development</a><a href="/settings" {% if request.path.startswith('/settings') %}aria-current="page"{% endif %}>Settings</a><a href="/audit" {% if request.path == '/audit' %}aria-current="page"{% endif %}>Audit</a>
</nav><span id="connection" class="connection" role="status"><i></i><span>Connecting</span></span></div></header>
<main id="content">{% block content %}{% endblock %}</main>
<footer><span>PiNOC web operations console</span><a href="/health">Service health</a><a href="/settings/status">Database status</a></footer>
<script src="{{ url_for('static', filename='app.js') }}"></script><script>PiNOC.connection();</script>{% block scripts %}{% endblock %}</body></html>
