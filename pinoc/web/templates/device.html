{% extends "base.html" %}{% block title %}Device · PiNOC{% endblock %}{% block content %}<div id="device" data-id="{{ device_id }}"><p>Loading cached device state…</p></div><section class="panel"><div class="toolbar"><h2>History</h2><div id="ranges" class="filters"></div></div><div id="history-stats" class="summary"></div><div id="charts" class="charts"></div></section><section class="panel"><h2>Storage forecasts</h2><div id="forecasts"></div></section><section class="panel"><h2>Recent events</h2><div id="device-events"></div></section><section class="panel" id="logs" hidden><div class="toolbar"><h2>Service logs</h2><div id="log-controls" class="filters"><select id="log-unit" aria-label="Service unit"></select><button id="log-refresh" class="filter">Refresh</button><button id="log-copy" class="filter">Copy</button><button id="log-download" class="filter">Download</button></div></div><pre id="log-output" class="log-output"></pre><p id="log-note" class="muted"></p></section>{% endblock %}
