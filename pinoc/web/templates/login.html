<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Login · PiNOC</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main class="login"><section class="panel"><h1>Sign in to PiNOC</h1>{% if error %}<p class="severity-critical">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form></section></main></body></html>
